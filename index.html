<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرر الصور</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #1a1a2e);
    color: var(--tg-theme-text-color, #fff);
    min-height: 100vh;
    padding: 16px;
  }

  .upload-area {
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 20px;
  }

  .upload-area:hover { border-color: #7c6af7; background: rgba(124,106,247,0.05); }
  .upload-area.hidden { display: none; }

  .upload-icon { font-size: 48px; margin-bottom: 12px; }
  .upload-text { font-size: 16px; opacity: 0.7; }

  #fileInput { display: none; }

  .canvas-container {
    display: none;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    background: #000;
    text-align: center;
  }

  .canvas-container.visible { display: block; }

  #canvas {
    max-width: 100%;
    max-height: 300px;
    object-fit: contain;
  }

  .controls {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
  }

  .controls.visible { display: flex; }

  .control-group {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 14px;
  }

  .control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .control-label {
    font-size: 14px;
    font-weight: 600;
    opacity: 0.9;
  }

  .control-value {
    font-size: 13px;
    color: #7c6af7;
    font-weight: 700;
    min-width: 45px;
    text-align: left;
  }

  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #7c6af7;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(124,106,247,0.5);
  }

  .presets {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .presets.visible { display: flex; }

  .presets-title {
    font-size: 14px;
    font-weight: 600;
    opacity: 0.6;
    margin-bottom: 4px;
  }

  .presets-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .preset-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 6px;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .preset-btn:hover, .preset-btn.active {
    background: #7c6af7;
    border-color: #7c6af7;
  }

  .buttons {
    display: none;
    gap: 10px;
    margin-bottom: 16px;
  }

  .buttons.visible { display: flex; }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-reset {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .btn-send {
    background: #7c6af7;
    color: #fff;
  }

  .btn:active { transform: scale(0.97); }

  .status {
    text-align: center;
    font-size: 13px;
    opacity: 0.6;
    padding: 10px;
  }
</style>
</head>
<body>

<!-- منطقة رفع الصورة -->
<div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
  <div class="upload-icon">🖼️</div>
  <div class="upload-text">اضغط لاختيار صورة</div>
  <input type="file" id="fileInput" accept="image/*">
</div>

<!-- عرض الصورة -->
<div class="canvas-container" id="canvasContainer">
  <canvas id="canvas"></canvas>
</div>

<!-- الفلاتر السريعة -->
<div class="presets" id="presets">
  <div class="presets-title">فلاتر سريعة</div>
  <div class="presets-grid">
    <button class="preset-btn active" onclick="applyPreset('original')">عادي</button>
    <button class="preset-btn" onclick="applyPreset('vivid')">حيوي</button>
    <button class="preset-btn" onclick="applyPreset('warm')">دافئ</button>
    <button class="preset-btn" onclick="applyPreset('cool')">بارد</button>
    <button class="preset-btn" onclick="applyPreset('bw')">أبيض وأسود</button>
    <button class="preset-btn" onclick="applyPreset('dramatic')">دراماتيك</button>
    <button class="preset-btn" onclick="applyPreset('vintage')">كلاسيك</button>
    <button class="preset-btn" onclick="applyPreset('fade')">فيد</button>
  </div>
</div>

<!-- أدوات التحكم -->
<div class="controls" id="controls">

  <div class="control-group">
    <div class="control-header">
      <span class="control-label">☀️ السطوع</span>
      <span class="control-value" id="brightnessVal">100%</span>
    </div>
    <input type="range" id="brightness" min="0" max="200" value="100" oninput="updateFilter()">
  </div>

  <div class="control-group">
    <div class="control-header">
      <span class="control-label">🎭 التباين</span>
      <span class="control-value" id="contrastVal">100%</span>
    </div>
    <input type="range" id="contrast" min="0" max="200" value="100" oninput="updateFilter()">
  </div>

  <div class="control-group">
    <div class="control-header">
      <span class="control-label">🎨 التشبع</span>
      <span class="control-value" id="saturationVal">100%</span>
    </div>
    <input type="range" id="saturation" min="0" max="200" value="100" oninput="updateFilter()">
  </div>

  <div class="control-group">
    <div class="control-header">
      <span class="control-label">🌡️ درجة الحرارة</span>
      <span class="control-value" id="hueVal">0°</span>
    </div>
    <input type="range" id="hue" min="-180" max="180" value="0" oninput="updateFilter()">
  </div>

  <div class="control-group">
    <div class="control-header">
      <span class="control-label">🌫️ ضبابية</span>
      <span class="control-value" id="blurVal">0px</span>
    </div>
    <input type="range" id="blur" min="0" max="10" value="0" step="0.1" oninput="updateFilter()">
  </div>

  <div class="control-group">
    <div class="control-header">
      <span class="control-label">⬛ تدرج رمادي</span>
      <span class="control-value" id="grayscaleVal">0%</span>
    </div>
    <input type="range" id="grayscale" min="0" max="100" value="0" oninput="updateFilter()">
  </div>

</div>

<!-- أزرار -->
<div class="buttons" id="buttons">
  <button class="btn btn-reset" onclick="resetAll()">↺ إعادة تعيين</button>
  <button class="btn btn-send" onclick="sendImage()">✉️ إرسال</button>
</div>

<div class="status" id="status"></div>

<script>
  // تهيئة تيليغرام
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let originalImage = null;

  // رفع الصورة
  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        originalImage = img;
        drawImage();
        showControls();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function drawImage() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ضبط حجم الكانفاس
    const maxW = window.innerWidth - 32;
    const maxH = 300;
    let w = originalImage.width;
    let h = originalImage.height;

    if (w > maxW) { h = h * maxW / w; w = maxW; }
    if (h > maxH) { w = w * maxH / h; h = maxH; }

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(originalImage, 0, 0, w, h);
  }

  function updateFilter() {
    const brightness = document.getElementById('brightness').value;
    const contrast = document.getElementById('contrast').value;
    const saturation = document.getElementById('saturation').value;
    const hue = document.getElementById('hue').value;
    const blur = document.getElementById('blur').value;
    const grayscale = document.getElementById('grayscale').value;

    // تحديث القيم المعروضة
    document.getElementById('brightnessVal').textContent = brightness + '%';
    document.getElementById('contrastVal').textContent = contrast + '%';
    document.getElementById('saturationVal').textContent = saturation + '%';
    document.getElementById('hueVal').textContent = hue + '°';
    document.getElementById('blurVal').textContent = blur + 'px';
    document.getElementById('grayscaleVal').textContent = grayscale + '%';

    // تطبيق الفلاتر
    const canvas = document.getElementById('canvas');
    canvas.style.filter = `
      brightness(${brightness}%)
      contrast(${contrast}%)
      saturate(${saturation}%)
      hue-rotate(${hue}deg)
      blur(${blur}px)
      grayscale(${grayscale}%)
    `;
  }

  function applyPreset(name) {
    // إزالة التحديد عن الكل
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    const presets = {
      original:  { b: 100, c: 100, s: 100, h: 0,   bl: 0, g: 0  },
      vivid:     { b: 110, c: 130, s: 180, h: 0,   bl: 0, g: 0  },
      warm:      { b: 105, c: 110, s: 120, h: 20,  bl: 0, g: 0  },
      cool:      { b: 100, c: 110, s: 110, h: -20, bl: 0, g: 0  },
      bw:        { b: 100, c: 120, s: 0,   h: 0,   bl: 0, g: 100},
      dramatic:  { b: 90,  c: 160, s: 80,  h: 0,   bl: 0, g: 0  },
      vintage:   { b: 95,  c: 90,  s: 70,  h: 15,  bl: 0, g: 20 },
      fade:      { b: 110, c: 80,  s: 70,  h: 0,   bl: 0, g: 0  },
    };

    const p = presets[name];
    document.getElementById('brightness').value = p.b;
    document.getElementById('contrast').value = p.c;
    document.getElementById('saturation').value = p.s;
    document.getElementById('hue').value = p.h;
    document.getElementById('blur').value = p.bl;
    document.getElementById('grayscale').value = p.g;
    updateFilter();
  }

  function resetAll() {
    document.getElementById('brightness').value = 100;
    document.getElementById('contrast').value = 100;
    document.getElementById('saturation').value = 100;
    document.getElementById('hue').value = 0;
    document.getElementById('blur').value = 0;
    document.getElementById('grayscale').value = 0;
    document.getElementById('canvas').style.filter = 'none';
    updateFilter();

    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.preset-btn').classList.add('active');
  }

  function showControls() {
    document.getElementById('uploadArea').classList.add('hidden');
    document.getElementById('canvasContainer').classList.add('visible');
    document.getElementById('presets').classList.add('visible');
    document.getElementById('controls').classList.add('visible');
    document.getElementById('buttons').classList.add('visible');
  }

  function sendImage() {
    const status = document.getElementById('status');
    status.textContent = '⏳ جاري تحضير الصورة...';

    // رسم الصورة مع الفلاتر على كانفاس جديد
    const srcCanvas = document.getElementById('canvas');
    const offscreen = document.createElement('canvas');
    offscreen.width = originalImage.width;
    offscreen.height = originalImage.height;
    const ctx = offscreen.getContext('2d');

    // تطبيق الفلاتر على الكانفاس
    const brightness = document.getElementById('brightness').value;
    const contrast = document.getElementById('contrast').value;
    const saturation = document.getElementById('saturation').value;
    const hue = document.getElementById('hue').value;
    const blur = document.getElementById('blur').value;
    const grayscale = document.getElementById('grayscale').value;

    ctx.filter = `
      brightness(${brightness}%)
      contrast(${contrast}%)
      saturate(${saturation}%)
      hue-rotate(${hue}deg)
      blur(${blur}px)
      grayscale(${grayscale}%)
    `;

    ctx.drawImage(originalImage, 0, 0);

    // تحويل لـ base64 وإرسال لتيليغرام
    const imageData = offscreen.toDataURL('image/jpeg', 0.92);

    tg.sendData(JSON.stringify({
      type: 'edited_image',
      image: imageData
    }));

    status.textContent = '✅ تم الإرسال!';
  }
</script>
</body>
</html>
